server {
    listen 3000;
    location / {
        proxy_pass http://app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Streamlit rejects websockets whose Origin doesn't match the host it sees;
        # the preview is served through a proxy hostname, so normalise both headers.
        proxy_set_header Host localhost:8501;
        proxy_set_header Origin http://localhost:8501;
        proxy_read_timeout 86400;
    }
}
