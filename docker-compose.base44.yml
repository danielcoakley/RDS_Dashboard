services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enms
      POSTGRES_USER: enms
      POSTGRES_PASSWORD: enms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enms -d enms"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - pipcache:/root/.cache/pip
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://enms:enms@db:5432/enms
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - nodecache:/app/node_modules
      - nextcache:/app/.next
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-localhost}
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    command: >
      sh -c "npm install &&
             npx next dev -p 3000 -H 0.0.0.0"

  proxy:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

volumes:
  pgdata:
  pipcache:
  nodecache:
  nextcache:
